<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひらがな おべんきょう</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
      font-size: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 20px auto;
    }
    .card {
      background: #ffffff;
      border: 3px solid #4a90e2;
      border-radius: 12px;
      font-size: 48px;
      font-weight: bold;
      color: #2c3e50;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      user-select: none;
    }
    .card:active {
      transform: scale(0.95);
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-top: 10px;
    }
    button:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <h1>ひらがな 12こ</h1>
  <div class="grid" id="charGrid"></div>
  <button onclick="generate()">もういちど（更新）</button>

  <script>
    const seion = [
      'あ','い','う','え','お',
      'か','き','く','け','こ',
      'さ','し','す','せ','そ',
      'た','ち','つ','て','と',
      'な','に','ぬ','ね','の',
      'は','ひ','ふ','へ','ほ',
      'ま','み','む','め','も',
      'や','ゆ','よ',
      'ら','り','る','れ','ろ',
      'わ','を','ん'
    ];

    const dakuon = [
      'が','ぎ','ぐ','げ','ご',
      'ざ','じ','ず','ぜ','ぞ',
      'だ','ぢ','づ','で','ど',
      'ば','び','ぶ','べ','ぼ'
    ];

    const handakuon = ['ぱ','ぴ','ぷ','ぺ','ぽ'];

    function getRandomSample(arr, count) {
      const shuffled = [...arr].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function generate() {
      const selectedSeion = getRandomSample(seion, 7);
      const selectedDakuon = getRandomSample(dakuon, 4);
      const selectedHandakuon = getRandomSample(handakuon, 1);

      const combined = [...selectedSeion, ...selectedDakuon, ...selectedHandakuon];
      const result = combined.sort(() => 0.5 - Math.random());

      const grid = document.getElementById('charGrid');
      grid.innerHTML = '';
      result.forEach(char => {
        const div = document.createElement('div');
        div.className = 'card';
        div.textContent = char;

        div.onclick = () => speak(char);

        grid.appendChild(div);
      });
    }

    // 音声読み上げ関数（高音質音声の選定とパラメータ調整）
    function speak(text) {
      window.speechSynthesis.cancel();

      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 0.85; // スピード（少しゆっくり）
      uttr.pitch = 1.2; // トーンを少し高くして柔らかい声に

      // 利用可能な音声一覧を取得して自然な声を選択
      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => 
        v.lang.includes('ja') && (v.name.includes('Otoya') || v.name.includes('Siri') || v.name.includes('Hattori') || v.name.includes('Google'))
      );

      if (preferredVoice) {
        uttr.voice = preferredVoice;
      }

      window.speechSynthesis.speak(uttr);
    }

    // iPhoneでの音声一覧読み込み対策
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => {};
    }

    generate();
  </script>

</body>
</html>
