<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たんご おべんきょう</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
      font-size: 24px;
    }
    .card-container {
      max-width: 500px;
      margin: 20px auto;
    }
    .card {
      background: #ffffff;
      border: 4px solid #4a90e2;
      border-radius: 16px;
      font-size: 42px;
      font-weight: bold;
      color: #2c3e50;
      padding: 35px 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      user-select: none;
      letter-spacing: 4px;
      word-break: break-all;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card:active {
      transform: scale(0.98);
    }
    .hint {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }
    button {
      font-size: 18px;
      padding: 12px 28px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    button:active {
      transform: translateY(2px);
    }
    .back-link {
      display: block;
      margin-top: 30px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>たんごの おべnきょう</h1>

  <div class="card-container">
    <div class="card" id="wordCard" onclick="speakCurrentWord()">---</div>
    <div class="hint">💡 もじをタップすると こえがでるよ</div>
  </div>

  <button onclick="nextWord()">つぎの たんご</button>

  <a href="./index.html" class="back-link">
    ← おべんきょう一覧に戻る
  </a>

  <script>
    // 子供向け単語100選（3〜6文字中心）
    const wordList = [
      // どうぶつ・いきもの (25)
      'らいおん', 'きりん', 'ごりら', 'うさぎ', 'ぞうさん', 
      'ねこちゃん', 'いぬ', 'くまさん', 'かんがるー', 'ぺんぎん', 
      'りすさん', 'ひつじ', 'うまさん', 'ぶたさん', 'かめさん', 
      'らっこ', 'いるか', 'くじら', 'かぶとむし', 'くわがた', 
      'ちょうちょう', 'てんとうむし', 'バッタ', 'トンボ', 'みつばち',

      // たべもの・くだもの (25)
      'いちご', 'すいか', 'りんご', 'みかん', 'ぶどう', 
      'ばなな', 'めろん', 'もも', 'パイナップル', 'たまご', 
      'おにぎり', 'ぱん', 'らーめん', 'うどん', 'かれーらいす', 
      'はんばーぐ', 'おむらいす', 'ぐらたん', 'すぱげってぃ', 'ぽてと', 
      'にんじん', 'だいこん', 'とまと', 'きゅうり', 'とうもろこし',

      // のりもの (15)
      'ひこうき', 'しんかんせん', 'しょうぼうしゃ', 'きゅうきゅうしゃ', 'パトカー', 
      'でんしゃ', 'バス', 'ふね', 'ろけっと', 'へりこぷたー', 
      'たくしー', 'じてんしゃ', 'とらっく', 'ショベルカー', 'ブルドーザー',

      // がっこう・こうぐ・せいかつ (20)
      'えんぴつ', 'けしごむ', 'ふでばこ', 'のーと', 'はさみ', 
      'のり', 'ランドセル', 'つくえ', 'いす', 'とけい', 
      'てれび', 'かがみ', 'かばん', 'くつ', 'ぼうし', 
      'ハンカチ', 'ティッシュ', 'コップ', 'はぶらし', 'たおる',

      // しぜん・きせつ・たのしいこと (15)
      'ひまわり', 'あさがお', 'たんぽぽ', 'ちゅうりっぷ', 'さくら', 
      'たいよう', 'おつきさま', 'おほしさま', 'にじ', 'すべりだい', 
      'ぶらんこ', 'じゃんぐるじむ', 'おりがみ', 'つみき', 'おてがみ'
    ];

    let currentWord = '';

    function nextWord() {
      let newWord = currentWord;
      // 連投防止（同じ単語が2回連続で出ないように処理）
      while (newWord === currentWord) {
        const randomIndex = Math.floor(Math.random() * wordList.length);
        newWord = wordList[randomIndex];
      }
      currentWord = newWord;

      document.getElementById('wordCard').textContent = currentWord;
    }

    function speakCurrentWord() {
      if (!currentWord) return;

      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(currentWord);
      uttr.lang = 'ja-JP';
      uttr.rate = 0.8; // 子供用にゆっくり
      uttr.pitch = 1.2; // 柔らかいトーン

      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => 
        v.lang.includes('ja') && (v.name.includes('Otoya') || v.name.includes('Siri') || v.name.includes('Google'))
      );
      if (preferredVoice) uttr.voice = preferredVoice;

      window.speechSynthesis.speak(uttr);
    }

    // 初回表示
    nextWord();
  </script>

</body>
</html>
